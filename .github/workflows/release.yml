name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.resolve_ref.outputs.checkout_ref }}
      derived_versioning_active: ${{ steps.resolve_ref.outputs.derived_versioning_active }}
      build_name: ${{ steps.resolve_ref.outputs.build_name }}
      build_number: ${{ steps.resolve_ref.outputs.build_number }}
    steps:
      - name: Resolve build ref and release versioning
        id: resolve_ref
        shell: bash
        env:
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          checkout_ref="$WORKFLOW_REF"
          derived_versioning_active=false
          build_name=
          build_number=
          version_ref=
          invalid_ref=

          if [[ "$WORKFLOW_EVENT_NAME" == "push" && "$WORKFLOW_REF_TYPE" == "tag" ]]; then
            version_ref="$WORKFLOW_REF_NAME"
            invalid_ref="$WORKFLOW_REF_NAME"
            checkout_ref="$WORKFLOW_REF"
          elif [[ "$WORKFLOW_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw_ref="$DISPATCH_INPUT_REF"

            if [[ -z "$raw_ref" ]]; then
              checkout_ref="$WORKFLOW_REF"
            elif [[ "$raw_ref" == "refs/tags" || "$raw_ref" == "refs/tags/" ]]; then
              echo "Invalid release tag ref: $raw_ref" >&2
              exit 1
            elif [[ "$raw_ref" =~ ^refs/tags/ ]]; then
              version_ref="${raw_ref#refs/tags/}"
              invalid_ref="$raw_ref"
              checkout_ref="$raw_ref"
            elif [[ "$raw_ref" =~ ^v ]]; then
              version_ref="$raw_ref"
              invalid_ref="$raw_ref"
              checkout_ref="refs/tags/$raw_ref"
            else
              checkout_ref="$raw_ref"
            fi

            if [[ -n "$version_ref" && ! "$version_ref" =~ ^v ]]; then
              echo "Invalid release tag ref: $invalid_ref" >&2
              exit 1
            fi
          fi

          if [[ -n "$version_ref" ]]; then
            if [[ ! "$version_ref" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Invalid release tag ref: $invalid_ref" >&2
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"

            if [[ ( "$major" != "0" && "$major" =~ ^0 ) || ( "$minor" != "0" && "$minor" =~ ^0 ) || ( "$patch" != "0" && "$patch" =~ ^0 ) ]]; then
              echo "Invalid release tag ref: $invalid_ref" >&2
              exit 1
            fi

            if (( major > 2099 || minor > 999 || patch > 999 || (major == 0 && minor == 0 && patch == 0) )); then
              echo "Invalid release tag ref: $invalid_ref" >&2
              exit 1
            fi

            derived_versioning_active=true
            build_name="$major.$minor.$patch"
            build_number="$((major * 1000000 + minor * 1000 + patch))"
          fi

          {
            echo "checkout_ref=$checkout_ref"
            echo "derived_versioning_active=$derived_versioning_active"
            echo "build_name=$build_name"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android release signing
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for var_name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!var_name}" ]]; then
              echo "Missing required Android signing secret: $var_name" >&2
              exit 1
            fi
          done

          mkdir -p android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$ANDROID_UPLOAD_STORE_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          EOF

      - name: Build release APK
        shell: bash
        env:
          DERIVED_VERSIONING_ACTIVE: ${{ needs.resolve.outputs.derived_versioning_active }}
          BUILD_NAME: ${{ needs.resolve.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
        run: |
          if [[ "$DERIVED_VERSIONING_ACTIVE" == "true" ]]; then
            flutter build apk --release --dart-define=FLUTTER_IMPELLER_ENABLED=false --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          else
            flutter build apk --release --dart-define=FLUTTER_IMPELLER_ENABLED=false
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-ios:
    needs: resolve
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        shell: bash
        env:
          DERIVED_VERSIONING_ACTIVE: ${{ needs.resolve.outputs.derived_versioning_active }}
          BUILD_NAME: ${{ needs.resolve.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
        run: |
          if [[ "$DERIVED_VERSIONING_ACTIVE" == "true" ]]; then
            flutter build ios --release --no-codesign --dart-define=FLUTTER_IMPELLER_ENABLED=false --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          else
            flutter build ios --release --no-codesign --dart-define=FLUTTER_IMPELLER_ENABLED=false
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: app.ipa
          retention-days: 7

  publish:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [build, build-ios]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-artifacts/apk

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-ipa
          path: release-artifacts/ipa

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp release-artifacts/apk/app-release.apk release/app-release.apk
          cp release-artifacts/ipa/app.ipa release/app.ipa

          cat <<'EOF' > release/release-notes.md
          ## 更新内容
          - 请补充本次版本说明
          - Android: app-release.apk
          - iOS: app.ipa（未签名，需用 AltStore / Sideloadly / 爱思助手 等工具自签安装）
          EOF

      - name: Create or update GitHub release
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/app-release.apk release/app.ipa --clobber
          else
            gh release create "$TAG_NAME" release/app-release.apk release/app.ipa --title "$TAG_NAME" --notes-file release/release-notes.md
          fi
